<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fradhyle - Portfolio Links</title>
	<style>
		:root {
			--bg-color: #1a1a1a;
			--btn-bg: #2d2d2d;
			--text-color: #ffffff;
			--accent-color: #e74c3c;
			--secondary-accent: #3498db;
			--hover-bg: #3d3d3d;
		}

		body {
			font-family: 'Noto Sans KR', sans-serif;
			background-color: var(--bg-color);
			color: var(--text-color);
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			min-height: 100vh;
		}

		.container {
			width: 100%;
			max-width: 600px;
			padding: 50px 20px;
			text-align: center;
			box-sizing: border-box;
		}

		/* 프로필 이미지 영역 */
		.profile-img {
			width: 120px;
			height: 120px;
			border-radius: 50%;
			background-color: #444;
			margin: 0 auto 20px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 3.5rem;
			overflow: hidden;
		}

		.profile-img img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		h1 {
			font-size: 1.8rem;
			margin: 0 0 10px 0;
			letter-spacing: 1px;
		}

		p.description {
			font-size: 1.05rem;
			color: #aaa;
			margin-bottom: 40px;
			line-height: 1.6;
		}

		/* 링크 버튼 컨테이너 */
		.link-container {
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		/* 개별 버튼 스타일 */
		.link-btn {
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: var(--btn-bg);
			color: var(--text-color);
			text-decoration: none;
			padding: 20px;
			border-radius: 40px;
			font-size: 1.1rem;
			font-weight: 500;
			transition: all 0.3s ease;
			border: 2px solid transparent;
		}

		.link-btn:hover {
			transform: translateY(-3px);
			background-color: var(--hover-bg);
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
		}

		/* 프로젝트별 포인트 컬러 (Hover 시 테두리 색상 변화) */
		.btn-translation:hover {
			border-color: #f1c40f;
		}

		.btn-voo-ong:hover {
			border-color: var(--accent-color);
		}

		.btn-imx:hover {
			border-color: var(--secondary-accent);
		}

		footer {
			margin-top: auto;
			padding: 30px 20px;
			font-size: 0.9rem;
			color: #666;
		}
	</style>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

	<div class="container">
		<div class="profile-img">
			🧑‍💻
		</div>
		<h1>Fradhyle</h1>
		<p class="description">
			프리랜서 번역가 & 데이터/백엔드 개발자<br>
			번역 포트폴리오와 개발 프로젝트 아카이브입니다.
		</p>

		<div class="link-container">
			
			<a href="여기에_이력서_URL_입력" class="link-btn btn-translation" target="_blank">
				📝 이력서
			</a>

			<a href="https://github.com/Fradhyle/IMX" class="link-btn btn-imx" target="_blank">
				📅 IMX (학원/교습소 일정 통합 관리)
			</a>

			<a href="/Voo-ong" class="link-btn btn-voo-ong">
				🦉 Voo-ong (개인 맞춤형 영화 추천)
			</a>

			<a href="https://github.com/Fradhyle" class="link-btn" target="_blank">
				💻 GitHub 프로필
			</a>

		</div>
	</div>

	<footer>
		&copy; <span id="year"></span> Fradhyle. All rights reserved.
	</footer>

	<script>
		document.getElementById('year').textContent = new Date().getFullYear();
	</script>

</body>

</html>
